name: decompile-bds-final

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 含基准合并产物 decompiled-bds 的运行 id
        required: true
      fix_runs:
        description: 含 patch-* 补丁产物的运行 id,逗号分隔,补丁取并集
        required: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download base merged file
        uses: actions/download-artifact@v4
        with:
          name: decompiled-bds
          path: base
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download patches from fix runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p patches
          for r in $(echo "${{ inputs.fix_runs }}" | tr ',' ' '); do
            echo "=== run $r ==="
            gh api "repos/${{ github.repository }}/actions/runs/$r/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name|startswith("patch-")) | "\(.id) \(.name)"' > list.txt
            while read -r aid aname; do
              [ -z "${aid:-}" ] && continue
              curl -sL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$aid/zip" -o a.zip
              rm -rf tmpd && mkdir tmpd
              unzip -oq a.zip -d tmpd
              cp tmpd/patch-*.c "patches/$aname.c"
              echo "got $aname ($(wc -c < "patches/$aname.c") bytes)"
            done < list.txt
          done
          echo "patch files:"; ls -lh patches || true

      - name: Splice patches into base
        run: |
          set -euo pipefail
          ls -lh base
          time python3 tools/patchsplice.py base/bedrock_server.c bedrock_server.c
          ls -lh bedrock_server.c
          wc -l bedrock_server.c
          grep -c '^// function ' bedrock_server.c || true
          grep -c '^// decompile failed' bedrock_server.c || true

      - name: Upload final C
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-bds-final
          path: bedrock_server.c
          retention-days: 90
