name: build-multiarch

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: gcc
            target: helloworld-x86_64
            flags: -Wall -Wextra -O2
          - arch: i686
            cc: gcc
            target: helloworld-i686
            flags: -m32 -Wall -Wextra -O2
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            target: helloworld-aarch64
            flags: -Wall -Wextra -O2
          - arch: armv7
            cc: arm-linux-gnueabihf-gcc
            target: helloworld-armv7
            flags: -Wall -Wextra -O2
          - arch: riscv64
            cc: riscv64-linux-gnu-gcc
            target: helloworld-riscv64
            flags: -Wall -Wextra -O2

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchains
        run: |
          sudo apt-get update -y
          case "${{ matrix.arch }}" in
            aarch64)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
            armv7)
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              ;;
            riscv64)
              sudo apt-get install -y gcc-riscv64-linux-gnu
              ;;
            i686)
              sudo apt-get install -y gcc-multilib
              ;;
            x86_64)
              sudo apt-get install -y build-essential
              ;;
          esac

      - name: Build
        run: |
          ${{ matrix.cc }} ${{ matrix.flags }} -o ${{ matrix.target }} main.c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}
