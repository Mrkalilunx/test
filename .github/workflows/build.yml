name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build C with gcc
        run: gcc -Wall -Wextra -o helloworld main.c

      - name: Run binary
        run: ./helloworld

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helloworld-linux
          path: helloworld
